<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchoolPay — School Payment Platform</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="landing">
    <div class="landing-card">
      <div class="landing-wordmark">SchoolPay</div>
      <p class="landing-sub">Secure, trackable school fee payments</p>

      <div>
        <p class="landing-section-title">Students &amp; Parents</p>
        <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Use the direct link your school shared with you. Or enter your school portal ID below.</p>
        <div class="sp-form-group">
          <label class="sp-label">School Portal ID</label>
          <input class="sp-input" id="school-slug" placeholder="e.g. greenfield-academy" />
          <small class="sp-input-hint">Ask your bursar or check your school notice board for the portal ID.</small>
        </div>
        <div id="slug-error" style="color:var(--danger);font-size:12px;margin-bottom:10px;display:none"></div>
        <button class="btn btn-primary btn-block" onclick="goToPortal()">Go to Payment Portal</button>
      </div>

      <div class="landing-divider"></div>

      <div>
        <p class="landing-section-title">School Staff</p>
        <a href="/admin/login.html" class="btn btn-outline btn-block" style="margin-bottom:10px">Admin / Bursar Login</a>
        <a href="/super/login.html" class="btn btn-outline btn-block" style="font-size:12px">Platform Admin</a>
      </div>
    </div>
  </div>

  <div id="sp-toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('school-slug').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') goToPortal()
    })

    async function goToPortal() {
      const slug  = document.getElementById('school-slug').value.trim().toLowerCase()
      const errEl = document.getElementById('slug-error')
      errEl.style.display = 'none'
      if (!slug) { errEl.textContent = 'Please enter your school ID'; errEl.style.display = 'block'; return }
      // Quick validation — try to fetch the school
      try {
        await apiFetch(`/s/${slug}/public`)
        window.location.href = `/portal/index.html?school=${slug}`
      } catch {
        errEl.textContent = 'School not found. Please check the ID and try again.'
        errEl.style.display = 'block'
      }
    }
  </script>
</body>
</html>
